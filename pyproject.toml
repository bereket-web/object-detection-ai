[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boardwatch-object-detection"
version = "0.1.0"
description = "A locally deployable, fine-tuned tic-tac-toe cell object detector"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI/ML Portfolio Project" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "python-multipart>=0.0.9,<1",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
boardwatch = "boardwatch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boardwatch = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
